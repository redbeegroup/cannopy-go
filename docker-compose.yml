# Local full stack: database, API and web, built from this checkout.
#   cp .env.example .env
#   docker compose up --build
# Open http://localhost:8080. For day-to-day development run only the database
# (docker compose up -d db) and start the apps with pnpm dev; see docs/local-development.md.

name: cannopy-go

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cannopy}
      POSTGRES_USER: ${POSTGRES_USER:-cannopy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cannopy-dev-only}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER:-cannopy}:${POSTGRES_PASSWORD:-cannopy-dev-only}@db:5432/${POSTGRES_DB:-cannopy}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      AUTH_SECRET: ${AUTH_SECRET:-change-me-dev-only}
    expose:
      - '3000'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '${WEB_PORT:-8080}:80'

volumes:
  db-data:
